name: Validate IRIQODE

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate themes and icon assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned icon submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate manifests, mappings, and local assets
        run: npm run validate

      - name: Smoke-test Neovim colorscheme
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
          nvim --headless -u NONE --cmd "set runtimepath^=$PWD" +"colorscheme iriqode" +"lua assert(vim.g.colors_name == 'iriqode')" +qa
